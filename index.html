<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1b2330; --muted: #5b6676; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11161d; --fg: #e8ecf2; --muted: #9aa5b4; color-scheme: dark; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding-inline: 16px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0.5rem 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>Served from prefect-run.</p>
  </main>
</body>
</html>
