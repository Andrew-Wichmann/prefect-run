<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs</title>
<link rel="stylesheet" href="style.css">
<style>
  .table-wrap { overflow-x: auto; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--muted) 12%, transparent); }
  tr.row.selected td { background: color-mix(in srgb, var(--run) 16%, transparent); }
  .pager { display: flex; align-items: center; gap: 12px; margin: 12px 0 28px; color: var(--muted); }
  .pager button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: none; color: inherit; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  #stage-rows tr { cursor: pointer; }
  #stage-rows tr:hover td { background: color-mix(in srgb, var(--muted) 12%, transparent); }
  #snapshot { min-width: min(900px, 94vw); max-width: 96vw; }
  .snap-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .snap-bar .grow-sp { flex: 1; }
  .snap-bar button, .snap-bar select, button.snap, button.bust { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: none; color: inherit; cursor: pointer; }
  .snap-bar button:disabled { opacity: .4; cursor: default; }
  dialog { min-width: min(480px, 92vw); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
    background: var(--bg); color: var(--fg); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .dlg-head h3 { margin: 0; }
  .dlg-head button { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; }
  .ok { color: var(--ok); } .bad { color: var(--failed); }
  tr.filters th { padding: 4px 6px; font-weight: normal; }
  tr.filters input, tr.filters select { width: 100%; min-width: 80px; box-sizing: border-box; font: inherit; padding: 3px 6px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .pillsel { position: relative; min-width: 110px; }
  .pillsel .trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px; font: inherit; padding: 2px 6px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  .pillsel .opts { position: fixed; z-index: 30; display: grid; gap: 2px; padding: 6px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .28); }
  .pillsel .opts[hidden] { display: none; }
  .pillsel .opts button { display: flex; padding: 4px 6px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .pillsel .opts button:hover, .pillsel .opts button:focus-visible { background: color-mix(in srgb, var(--run) 14%, transparent); outline: none; }
  .pillsel .opts button[aria-selected=true] { background: var(--sel); }
  .pillsel .caret, .pillsel .all { color: var(--muted); }
  .pillsel .caret { font-size: 10px; }
  #detail { position: relative; }
  .detail-ico { position: absolute; top: 0; right: 0; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line);
    border-radius: 6px; color: inherit; text-decoration: none; }
  .detail-ico:hover { border-color: var(--run); }
  .detail-ico .picon { width: 18px; height: 18px; }
  .stage-card { cursor: pointer; }
  .stage-card:hover, .stage-card.selected { border-color: var(--run); }
  .stage-card.selected { background: color-mix(in srgb, var(--run) 12%, transparent); }
</style>
</head>
<body>
<header class="topbar">
  <h1>Jobs</h1>
  <div id="topbar-controls" class="controls"></div>
</header>
<main>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Job</th><th>COB</th><th>Status</th><th>Start</th><th>End</th><th>Duration</th><th>Delivery SLA</th><th>Duration SLA</th></tr>
        <tr class="filters">
          <th><select id="f-job" aria-label="Filter by job"></select></th>
          <th><input id="f-cob" type="date" aria-label="Filter by COB"></th>
          <th><div id="f-status"></div></th>
          <th></th><th></th>
          <th><input id="f-minutes" type="number" min="0" step="any" placeholder="≥ min" aria-label="Minimum duration in minutes"></th>
          <th><select id="f-sla" aria-label="Filter by delivery SLA">
            <option value="">All</option><option value="met">Met</option><option value="missed">Missed</option><option value="pending">Not finished</option>
          </select></th>
          <th><select id="f-dsla" aria-label="Filter by duration SLA">
            <option value="">All</option><option value="met">Met</option><option value="missed">Missed</option><option value="pending">Not finished</option>
          </select></th>
        </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pager">
    <button id="prev">← Newer</button>
    <span id="pageinfo"></span>
    <button id="next">Older →</button>
  </div>

  <section id="detail" hidden>
    <p class="eyebrow">Job detail</p>
    <a id="prefect-link" class="detail-ico" title="Open this run in Prefect" aria-label="Open this run in Prefect"></a>
    <dl class="meta" id="meta"></dl>
    <h3 class="eyebrow" style="margin-top:24px">Stages</h3>
    <div id="stages"></div>

    <section id="stage-detail" hidden>
      <div class="legend" id="legend"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Instrument</th><th>Status</th><th>Detail</th><th>Recorded</th></tr>
            <tr class="filters">
              <th><input id="s-key" placeholder="Filter" aria-label="Filter by instrument"></th>
              <th><select id="s-status" aria-label="Filter by status"></select></th>
              <th><input id="s-detail" placeholder="Filter" aria-label="Filter by detail"></th>
              <th><input id="s-at" placeholder="Filter" aria-label="Filter by recorded time"></th>
            </tr>
          </thead>
          <tbody id="stage-rows"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>
<dialog id="instrument">
  <form method="dialog" class="dlg-head"><h3 id="inst-title"></h3><button aria-label="Close">✕</button></form>
  <table>
    <thead><tr><th>Stage</th><th>Status</th><th>Detail</th><th>Recorded</th></tr></thead>
    <tbody id="inst-rows"></tbody>
  </table>
</dialog>
<dialog id="snapshot">
  <form method="dialog" class="dlg-head"><h3 id="snap-title"></h3><button aria-label="Close">✕</button></form>
  <div class="snap-bar">
    <select id="snap-run" aria-label="Task run"></select>
    <span id="snap-info" class="muted"></span>
    <span class="grow-sp"></span>
    <button id="snap-prev">← Prev</button><button id="snap-next">Next →</button>
  </div>
  <div class="table-wrap"><table id="snap-table"></table></div>
</dialog>
<script src="live.js"></script>
<script src="tz.js"></script>
<script src="stage-common.js"></script>
<script src="layouts.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Job and stage statuses are Prefect's state names; colour them by Prefect's state type.
const STATE_CLASS = { COMPLETED: "s-done", RUNNING: "s-inflight", PENDING: "s-inflight", CANCELLING: "s-inflight", FAILED: "s-failed", CRASHED: "s-failed" };
const pill = (s, type) => `<span class="pill ${STATE_CLASS[type] || "s-other"}">${esc(s)}</span>`;
const clock = (t) => fmtTime(t, { seconds: false });
const mins = (s, digits = 0) => s == null ? "–" : s < 60 ? `${s.toFixed(digits)} s` : `${(s / 60).toFixed(digits)} min`;
const sla = (v) => v === true ? `<span class="ok">✓</span>` : v === false ? `<span class="bad">✗</span>` : "–";
const slaText = ({ time, tz, day_offset = 0 }) => `${fmtZoned(time, tz)} T${day_offset ? "+" + day_offset : ""} · ${tz.split("/").pop().replace(/_/g, " ")}`;


let page = 0, pages = 1, selected = null, stage = null, stageNames = [], openKey = null, stageItems = [];
const STATUSES = ["init", "passed", "calibrated", "priced", "uploaded", "failed"];
const badge = (s) => `<span class="cell ${esc(s)}"><span class="dot"></span>${esc(s)}</span>`;
const when = (t) => fmtTime(t, { date: true });
$("legend").innerHTML = STATUSES.map(badge).join("");
$("s-status").innerHTML = `<option value="">All</option>` + STATUSES.map((v) => `<option>${v}</option>`).join("");
for (const id of ["s-key", "s-status", "s-detail", "s-at"]) $(id).addEventListener("input", () => renderStage());

const jobFilters = { job: "f-job", cob: "f-cob", status: "f-status", min_minutes: "f-minutes", sla: "f-sla", dsla: "f-dsla" };
const jobQuery = () => Object.entries(jobFilters)
  .map(([k, id]) => [k, $(id).value.trim()]).filter(([, v]) => v)
  .map(([k, v]) => `&${k}=${encodeURIComponent(v)}`).join("");
// A select whose options are the status pills (a native <select> cannot style its options). It behaves like one to the
// rest of the page: `.value` is the chosen status ("" for All), "input" fires when it changes, and `.fill(names)` sets the options.
function pillSelect(el, label) {
  let value = "";
  el.classList.add("pillsel");
  el.innerHTML = `<button type="button" class="trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(label)}"></button><div class="opts" role="listbox" hidden></div>`;
  const [trigger, menu] = el.children;
  const label_ = (v) => v ? pill(v, v.toUpperCase()) : `<span class="all">All</span>`;
  const draw = () => {
    trigger.innerHTML = `${label_(value)}<span class="caret" aria-hidden="true">▾</span>`;
    for (const b of menu.children) b.setAttribute("aria-selected", b.dataset.v === value);
  };
  const close = (refocus) => { menu.hidden = true; trigger.setAttribute("aria-expanded", "false"); if (refocus) trigger.focus(); };
  const choose = (v) => { const changed = v !== value; value = v; draw(); close(true); if (changed) el.dispatchEvent(new Event("input", { bubbles: true })); };
  const open = () => {
    const r = trigger.getBoundingClientRect();  // the menu is fixed-position so the table's scroll area cannot clip it
    Object.assign(menu.style, { top: `${r.bottom + 4}px`, left: `${r.left}px`, minWidth: `${r.width}px` });
    menu.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    (menu.querySelector("[aria-selected=true]") || menu.firstElementChild)?.focus();
  };
  Object.defineProperty(el, "value", { get: () => value, set: (v) => { value = v; draw(); } });
  el.fill = (names) => {
    if (menu.children.length) return;
    menu.innerHTML = ["", ...names].map((v) => `<button type="button" role="option" tabindex="-1" data-v="${esc(v)}">${label_(v)}</button>`).join("");
    draw();
  };
  trigger.onclick = () => menu.hidden ? open() : close(true);
  menu.onclick = (e) => { const b = e.target.closest("[role=option]"); if (b) choose(b.dataset.v); };
  menu.onkeydown = (e) => {
    const items = [...menu.children], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus(); e.preventDefault(); }
    else if (e.key === "Escape") close(true);
    else if (e.key === "Tab") close(false);
  };
  document.addEventListener("click", (e) => { if (!el.contains(e.target)) close(false); });
  addEventListener("resize", () => close(false));
  addEventListener("scroll", () => close(false), true);
  draw();
}
pillSelect($("f-status"), "Filter by status");

const fillSelect = (el, values) => {
  if (el.options.length) return;
  el.innerHTML = `<option value="">All</option>` + values.map((v) => `<option>${esc(v)}</option>`).join("");
};

async function loadPage() {
  const r = await fetch(`api/jobs?page=${page}${jobQuery()}`);
  if (!r.ok) { $("rows").innerHTML = `<tr><td colspan="9">Could not load jobs</td></tr>`; return; }
  const d = await r.json();
  fillSelect($("f-job"), d.jobs);
  $("f-status").fill(d.statuses);
  pages = Math.max(1, Math.ceil(d.total / d.page_size));
  if (page >= pages) { page = pages - 1; return loadPage(); }
  $("rows").innerHTML = d.rows.map((x) => `
    <tr class="row ${x.run_id === selected ? "selected" : ""}" data-run="${esc(x.run_id)}">
      <td>${esc(x.job)}</td><td>${esc(x.cob || "–")}</td><td>${pill(x.status, x.status_type)}</td>
      <td class="nw">${clock(x.start_time)}</td><td class="nw">${clock(x.end_time)}</td><td>${mins(x.duration_s)}</td><td>${sla(x.sla_met)}</td><td>${sla(x.duration_sla_met)}</td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">No runs match</td></tr>`;
  $("pageinfo").textContent = `Page ${page + 1} of ${pages} · ${d.total} runs`;
  $("prev").disabled = page === 0;
  $("next").disabled = page + 1 >= pages;
}

async function loadDetail() {
  if (!selected) return;
  const r = await fetch(`api/job?run=${encodeURIComponent(selected)}`);
  if (!r.ok) return;
  const j = await r.json();
  $("detail").hidden = false;
  $("prefect-link").href = j.url;
  $("prefect-link").innerHTML = PREFECT_ICON;
  const rows = [
    ["Delivery SLA", `${slaText(j.sla)} ${sla(j.sla_met)}` + (j.sla_deadline ? ` <span class="muted">due ${fmtTime(j.sla_deadline, { seconds: false, date: true })}</span>` : "")],
    ["Duration SLA", `within ${j.duration_sla.max_seconds} s ${sla(j.duration_sla_met)}`],
    ["Status", pill(j.status, j.status_type)],
    ["Iceberg table", j.iceberg_table ? `<code>${esc(j.iceberg_table)}</code>` : `<span class="muted">not configured</span>`],
    ["Flow run", (j.deployment_id ? `<button class="bust" data-label="rerun" data-select data-deployment="${esc(j.deployment_id)}" data-params="${esc(JSON.stringify(Object.fromEntries(Object.entries(j.parameters).filter(([k]) => k !== "bust_cache_from"))))}" title="Start a new run with the same parameters (cache not busted)">rerun</button>` : "")],
  ];
  stageNames = j.stages;
  $("stages").innerHTML = renderStages(j, stage);
  $("meta").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

async function loadStage() {
  if (!selected || !stage) { $("stage-detail").hidden = true; return; }
  const r = await fetch(`api/stage?run=${encodeURIComponent(selected)}&stage=${encodeURIComponent(stage)}`);
  if (!r.ok) return;
  stageItems = (await r.json()).items;
  renderStage();
}

function renderStage() {
  $("stage-detail").hidden = !stage;
  const key = $("s-key").value.trim().toLowerCase(), st = $("s-status").value, det = $("s-detail").value.trim().toLowerCase(), at = $("s-at").value.trim().toLowerCase();
  const items = stageItems.filter((i) =>
    i.key.toLowerCase().includes(key) && (!st || i.status === st) && (i.detail || "").toLowerCase().includes(det) && when(i.at).toLowerCase().includes(at));
  $("stage-rows").innerHTML = items.map((i) => `<tr data-key="${esc(i.key)}">
    <td><code>${esc(i.key)}</code></td><td>${badge(i.status)}</td><td>${esc(i.detail || "")}</td>
    <td class="muted nw">${when(i.at)}</td></tr>`).join("")
    || `<tr><td colspan="4" class="muted">${stageItems.length ? "No instruments match" : "This stage has not recorded anything for this run yet"}</td></tr>`;
}

$("stages").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".stage-card")) { e.preventDefault(); e.target.click(); }
});

async function loadInstrument() {
  if (!openKey) return;
  const r = await fetch(`api/instrument?run=${encodeURIComponent(selected)}&key=${encodeURIComponent(openKey)}`);
  if (!r.ok) return;
  const { stages } = await r.json();
  const by = Object.fromEntries(stages.map((s) => [s.stage_name, s]));
  $("inst-title").innerHTML = `<code>${esc(openKey)}</code>`;
  $("inst-rows").innerHTML = stageNames.map((n) => {
    const s = by[n];
    return `<tr><td>${esc(n)}</td><td>${s ? badge(s.status) : `<span class="muted">–</span>`}</td><td>${s ? esc(s.detail || "") : ""}</td>
      <td class="muted nw">${s ? when(s.recorded_at) : ""}</td></tr>`;
  }).join("");
  if (!$("instrument").open) $("instrument").showModal();
}

$("stage-rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-key]");
  if (!tr) return;
  openKey = tr.dataset.key;
  loadInstrument();
});
$("instrument").addEventListener("close", () => { openKey = null; });
$("instrument").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

// Inspect a stage's output: the Parquet snapshot of each task run of this stage in the flow run.
let snap = { stage: null, runs: [], offset: 0, total: 0 };
const SNAP_PAGE = 200;
const bytesText = (n) => n < 1e6 ? `${(n / 1e3).toFixed(0)} kB` : `${(n / 1e6).toFixed(1)} MB`;

async function openSnapshot(stageName) {
  const r = await fetch(`api/snapshots?run=${encodeURIComponent(selected)}&stage=${encodeURIComponent(stageName)}`);
  const { snapshots } = r.ok ? await r.json() : { snapshots: [] };
  snap = { stage: stageName, runs: snapshots, offset: 0, total: 0 };
  $("snap-title").innerHTML = `<code>${esc(stageName)}</code> output`;
  $("snap-run").innerHTML = snapshots.map((s, i) => `<option value="${s.task_run_id}">Task run ${i + 1} of ${snapshots.length} · ${when(s.at)} · ${s.rows} rows · ${bytesText(s.bytes)}</option>`).join("");
  $("snap-run").hidden = snapshots.length < 2;
  if (!$("snapshot").open) $("snapshot").showModal();
  await loadSnapshot();
}

async function loadSnapshot() {
  const id = $("snap-run").value;
  if (!id) { $("snap-table").innerHTML = ""; $("snap-info").textContent = "No snapshot for this stage in this run"; $("snap-prev").hidden = $("snap-next").hidden = true; return; }
  const r = await fetch(`api/snapshot?run=${encodeURIComponent(selected)}&stage=${encodeURIComponent(snap.stage)}&task_run=${id}&offset=${snap.offset}`);
  if (!r.ok) return;
  const d = await r.json();
  snap.total = d.total;
  $("snap-info").textContent = d.total ? `rows ${d.offset + 1}–${d.offset + d.rows.length} of ${d.total}` : "0 rows";
  $("snap-prev").hidden = $("snap-next").hidden = d.total <= SNAP_PAGE;
  $("snap-prev").disabled = d.offset <= 0;
  $("snap-next").disabled = d.offset + SNAP_PAGE >= d.total;
  const cell = (v) => v == null ? `<span class="muted">null</span>` : esc(typeof v === "object" ? JSON.stringify(v) : String(v));
  // The status is not a column of the file (it lives in the Parquet metadata), so it is shown as a leading widget.
  const status = (o) => o ? `<td class="nw" title="${esc(o.detail || "")}">${badge(o.status)}${o.detail ? ` <span class="muted">${esc(o.detail)}</span>` : ""}</td>` : `<td class="muted">–</td>`;
  $("snap-table").innerHTML = `<thead><tr>${d.has_outcomes ? "<th>status</th>" : ""}${d.columns.map((c) => `<th>${esc(c.name)}</th>`).join("")}</tr></thead>
    <tbody>${d.rows.map((row) => `<tr>${d.has_outcomes ? status(row.__outcome) : ""}${d.columns.map((c) => `<td class="nw">${cell(row[c.name])}</td>`).join("")}</tr>`).join("")}</tbody>`;
}
$("snap-run").onchange = () => { snap.offset = 0; loadSnapshot(); };
$("snap-prev").onclick = () => { snap.offset = Math.max(snap.offset - SNAP_PAGE, 0); loadSnapshot(); };
$("snap-next").onclick = () => { snap.offset += SNAP_PAGE; loadSnapshot(); };
$("snapshot").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

// Start a run straight from the dashboard: POST to Prefect's API, then link to the run it created.
async function startRun(btn) {
  btn.disabled = true;
  btn.textContent = "starting…";
  try {
    const r = await fetch(`/prefect/api/deployments/${btn.dataset.deployment}/create_flow_run`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parameters: JSON.parse(btn.dataset.params) }),
    });
    if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
    const run = await r.json();
    if ("select" in btn.dataset) {  // the card's own button: show the run it started
      selected = run.id;
      btn.disabled = false;
      btn.textContent = btn.dataset.label;
      loadPage(); loadDetail(); loadStage();
    } else {
      btn.outerHTML = `<a class="tlink" href="?run=${esc(run.id)}">started: ${esc(run.name)} →</a>`;
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = btn.dataset.label || "rerun from here";
    alert(`Could not start the run: ${err.message}`);
  }
}

$("meta").addEventListener("click", (e) => {
  const b = e.target.closest("button.bust");
  if (b) startRun(b);
});

$("stages").addEventListener("click", (e) => {
  const view = e.target.closest("button.snap");
  if (view) return void openSnapshot(view.dataset.stage);
  const bust = e.target.closest("button.bust");
  if (bust) return void startRun(bust);
  if (e.target.closest("a.tlink")) return;
  const b = e.target.closest(".stage-card");
  if (!b) return;
  stage = stage === b.dataset.stage ? null : b.dataset.stage;
  document.querySelectorAll(".stage-card").forEach((x) => x.classList.toggle("selected", x.dataset.stage === stage));
  loadStage();
});

$("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.row");
  if (!tr) return;
  selected = tr.dataset.run;
  document.querySelectorAll("tr.row").forEach((x) => x.classList.toggle("selected", x === tr));
  loadDetail();
  loadStage();
  $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
});
let filterTimer;
for (const id of Object.values(jobFilters)) {
  $(id).addEventListener("input", () => { clearTimeout(filterTimer); filterTimer = setTimeout(() => { page = 0; loadPage(); }, 250); });
}
$("prev").onclick = () => { page--; loadPage(); };
$("next").onclick = () => { page++; loadPage(); };

selected = new URLSearchParams(location.search).get("run");  // deep link to a run's detail
stage = new URLSearchParams(location.search).get("stage");
loadPage();
loadDetail();

// Live updates: the server pushes a message whenever the audit log or a Prefect run changes.
let refreshTimer;
const refresh = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => { loadPage(); loadDetail(); loadStage(); loadInstrument(); }, 150); };
connectLive(refresh);
zonePicker(() => { refresh(); });
setInterval(refresh, 60000);  // safety net
</script>
