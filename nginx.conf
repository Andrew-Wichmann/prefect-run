map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    absolute_redirect off;

    # Hello world page
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Prefect API (also carries the UI's websocket event stream)
    location /prefect/api/ {
        proxy_pass http://prefect-server:4200/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Prefect UI, served by Prefect under PREFECT_UI_SERVE_BASE=/prefect
    location /prefect/ {
        proxy_pass http://prefect-server:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audit history UI and its read-only API
    location /audit/ {
        proxy_pass http://audit-ui:8000/;
        proxy_set_header Host $host;
    }

    # Server-sent events: no buffering, long-lived
    location = /audit/api/stream {
        proxy_pass http://audit-ui:8000/api/stream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /audit {
        return 301 /audit/;
    }

    location = /prefect {
        return 301 /prefect/;
    }
}
