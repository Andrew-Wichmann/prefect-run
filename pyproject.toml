[project]
name = "prefect-run"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["prefect>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/run"]

[tool.pyright]
include = ["src", "flows"]
extraPaths = ["src", "flows"]
venvPath = "."
venv = ".venv"
