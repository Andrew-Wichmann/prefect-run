[project]
name = "joule"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["prefect>=3", "pyarrow", "psycopg[binary]>=3"]

[project.optional-dependencies]
dev = ["pyarrow-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joule"]

[tool.pyright]
include = ["src", "flows", "scripts"]
extraPaths = ["src", "flows"]
venvPath = "."
venv = ".venv"
